<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MclsPortal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!--
    Bhashini — the Government's own translation service (MeitY). It mounts its
    own floating language picker (top-right, positioned by data-pos-x/y), so the
    applicant masthead reserves right-side room for it rather than positioning
    it inline.

    It lives in <head> because the plugin appends its stylesheet to
    document.head as it initialises; loaded from <body> that runs before the
    element it wants exists and the widget never mounts.

    language-detection is off on purpose. With it on the plugin posts
    translate-text WITHOUT a sourceLanguage, and Bhashini's own service then
    fails with "Cannot read properties of undefined (reading 'sourceLanguage')".
    Off, it sends page-source-language and the request is well formed.

    Translation also needs the site's domain registered with Bhashini; until
    then the service answers "Domain is not registered". That cannot be done for
    localhost. The origins it calls are allow-listed in the portal's CSP in
    Program.cs — keep the two in step.
  -->
  <script
    src="https://translation-plugin.bhashini.co.in/v3/website_translation_utility.js"
    data-pos-x="20"
    data-pos-y="20"
    page-source-language="en"
    language-detection="false"
    language-icon-color="#1B4F8A"
    defer
  ></script>
</head>
<body>
  <app-root></app-root>

  <!--
    Mount point for the Bhashini widget loaded in <head>. The plugin appends
    into ".bhashini-plugin-container" and does not create it, so it must exist.
    It sits outside <app-root> so Angular's route changes do not remove it.
  -->
  <div class="bhashini-plugin-container"></div>
</body>
</html>
